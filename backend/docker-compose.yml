services:
  postgres:
    image: postgres:17
    container_name: gatehouse-postgres
    environment:
      POSTGRES_DB: gatehouse
      POSTGRES_USER: gatehouse
      POSTGRES_PASSWORD: gatehouse
    ports:
      - "5433:5432"
    volumes:
      - gatehouse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatehouse -d gatehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gatehouse-pgdata:
